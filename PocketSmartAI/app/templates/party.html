{% extends "base.html" %}{% block title %}Party Planner{% endblock %}{% block content %}<section class="planner"><div class="pagehead"><p class="eyebrow">PARTY PLANNER</p><h1>Plan your event without guesswork</h1></div><form class="planner-form" data-endpoint="/generate-party" data-type="party"><label>Total budget (₹)<input name="budget" type="number" min="1" required></label><label>City<input name="city" value="Chennai"></label><label>Event type<input name="event_type" placeholder="Birthday / Wedding / Corporate" required></label><label>Guests<input name="guests" type="number" min="1" required></label><label>Venue details<input name="venue" value="flexible"></label><label>Food preference<input name="food_preference" value="mixed"></label><label>Priorities<input name="priorities" value="food, comfort, decoration"></label><button class="button" type="submit">Generate Party Plan</button></form><div id="result"></div></section>{% endblock %}{% block scripts %}<script src="/static/js/planners.js"></script>{% endblock %}
