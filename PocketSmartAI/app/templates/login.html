{% extends "base.html" %}{% block title %}Login · PocketSmart AI{% endblock %}{% block content %}<section class="auth"><div class="panel"><h1>Welcome back</h1><p>Sign in to save and revisit your plans.</p><form id="loginForm"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="button" type="submit">Login</button><div id="formError" class="error"></div></form><p>New here? <a href="/register">Create an account</a></p></div></section>{% endblock %}{% block scripts %}<script>document.getElementById('loginForm').addEventListener('submit', async e=>{e.preventDefault();const f=new FormData(e.target);const r=await api('/api/login','POST',Object.fromEntries(f));if(r.ok) location.href='/dashboard';else document.getElementById('formError').textContent=(await r.json()).detail||'Login failed';});</script>{% endblock %}
