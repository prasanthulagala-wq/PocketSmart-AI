{% extends "base.html" %}{% block title %}Home Planner{% endblock %}{% block content %}<section class="planner"><div class="pagehead"><p class="eyebrow">HOME INTERIOR</p><h1>Build a home plan within budget</h1></div><form class="planner-form" data-endpoint="/generate-home" data-type="home"><label>Total budget (₹)<input name="budget" type="number" min="1" required placeholder="100000"></label><label>City<input name="city" value="Chennai"></label><label>Rooms<select name="rooms" multiple required><option selected>Living Room</option><option>Bedroom</option><option>Kitchen</option><option>Dining Room</option><option>Study</option></select></label><label>Style<select name="style"><option>modern</option><option>minimal</option><option>traditional</option><option>industrial</option></select></label><label>Priorities<input name="priorities" value="functionality, value for money"></label><label>Quantities (JSON)<textarea name="quantities">{"lights":4,"fans":2,"tables":1}</textarea></label><button class="button" type="submit">Generate Home Plan</button></form><div id="result"></div></section>{% endblock %}{% block scripts %}<script src="/static/js/planners.js"></script>{% endblock %}
