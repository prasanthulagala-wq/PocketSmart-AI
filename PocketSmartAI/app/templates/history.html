{% extends "base.html" %}{% block title %}History{% endblock %}{% block content %}<section class="pagehead"><p class="eyebrow">SAVED PLANS</p><h1>Your recommendation history</h1></section><div id="history" class="history"></div>{% endblock %}{% block scripts %}<script>async function load(){const r=await fetch('/history');if(!r.ok){location.href='/login';return}const data=await r.json();document.getElementById('history').innerHTML=data.length?data.map(x=>`<article class="panel history-item"><div><b>${x.planner.toUpperCase()}</b><h3>${x.result.title}</h3><p>Budget: ₹${Number(x.budget).toLocaleString('en-IN')} · ${new Date(x.created_at).toLocaleString()}</p></div><span class="tag">Saved</span></article>`).join(''):'<div class="panel"><p>No saved plans yet. Create your first plan from the dashboard.</p></div>'}load();</script>{% endblock %}
