{% extends "base.html" %}{% block title %}Jewelry Planner{% endblock %}{% block content %}<section class="planner"><div class="pagehead"><p class="eyebrow">JEWELRY PLANNER</p><h1>Match jewelry to your occasion and outfit</h1><p>Upload an outfit image optionally; the AI uses it for color/style context.</p></div><form class="planner-form" id="jewelryForm"><label>Budget (₹)<input name="budget" type="number" min="1" required></label><label>Occasion<input name="occasion" placeholder="Wedding / Festival / Party" required></label><label>Style<select name="style"><option>elegant</option><option>minimal</option><option>traditional</option><option>statement</option></select></label><label>Metal preference<input name="metal_preference" value="any"></label><label>Outfit description<textarea name="outfit_description" placeholder="Describe colors, neckline or overall style"></textarea></label><label>Optional outfit image<input name="outfit_image" type="file" accept="image/png,image/jpeg,image/webp"></label><button class="button" type="submit">Generate Jewelry Plan</button></form><div id="result"></div></section>{% endblock %}{% block scripts %}<script src="/static/js/planners.js"></script>{% endblock %}
