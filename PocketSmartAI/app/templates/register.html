{% extends "base.html" %}{% block title %}Register · PocketSmart AI{% endblock %}{% block content %}<section class="auth"><div class="panel"><h1>Create your account</h1><p>Your history stays associated with your account.</p><form id="registerForm"><label>Name<input name="name" required minlength="2"></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required minlength="8"></label><button class="button" type="submit">Register</button><div id="formError" class="error"></div></form><p>Already registered? <a href="/login">Login</a></p></div></section>{% endblock %}{% block scripts %}<script>document.getElementById('registerForm').addEventListener('submit', async e=>{e.preventDefault();const f=new FormData(e.target);const r=await api('/api/register','POST',Object.fromEntries(f));if(r.ok) location.href='/dashboard';else document.getElementById('formError').textContent=(await r.json()).detail||'Registration failed';});</script>{% endblock %}
